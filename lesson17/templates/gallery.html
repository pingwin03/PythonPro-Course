<!-- Plik: templates/gallery.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Galeria zdjęć</title>
</head>
<body>
    <h1>Moja Galeria zdjęć</h1>
    <div style="display: flex; gap: 15px;">
        <!-- Pętla for iteruje po liście słowników -->
        {% for image in gallery %}
            <div style="border: 1px solid #ccc; padding: 10px; text-align: center;">
                <!-- Wyciągamy dynamicznie url oraz caption z każdego słownika -->
                <img src="{{ image.url }}" alt="{{ image.caption }}">
                <p>{{ image.caption }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
